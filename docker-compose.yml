services:
  seed-scanner:
    build:
      context: .
      dockerfile: Dockerfile
    image: seed-scanner:latest
    container_name: seed-scanner
    volumes:
      # 扫描目录
      - ${SCAN_PATH:-/mnt}:/scan:ro
      # 输出目录
      - ${PROJECT_PATH:-.}/output:/app/output
      # 数据库目录
      - ${PROJECT_PATH:-.}/data:/app/data
      # 配置文件
      - ${PROJECT_PATH:-.}/config.yaml:/app/config.yaml:ro
      # OCR 模型缓存（持久化）
      - paddlex-models:/root/.paddlex
      - paddle-cache:/root/.cache/paddle
    environment:
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - FLAGS_use_mkldnn=0
      - FLAGS_enable_pir_api=0
      - TZ=${TZ:-Asia/Shanghai}
    command: ["/scan", "--config", "/app/config.yaml"]

volumes:
  paddlex-models:
  paddle-cache:
